<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceBridge — Enregistrements</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/voices.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body>

<header>
  <div class="header-top">
    <a href="/" class="logo"><span class="logo-icon">🎤</span><span>VoiceBridge</span></a>
    <div class="header-actions">
      <button class="status-badge" id="statusBadge"><span class="status-dot"></span><span class="status-label">…</span></button>
      <button class="theme-toggle" data-theme-toggle>🌙</button>
      <button class="btn-header" id="logoutBtn">Déconnexion</button>
    </div>
  </div>
  <nav class="app-nav">
    <a href="/studio"     class="nav-item" data-nav="/studio">Studio</a>
    <a href="/voices"     class="nav-item" data-nav="/voices">Mes voix</a>
    <a href="/rvc"        class="nav-item" data-nav="/rvc">Modèles RVC</a>
    <a href="/briefings"  class="nav-item" data-nav="/briefings">Briefings</a>
    <a href="/recordings" class="nav-item" data-nav="/recordings">Enregistrements</a>
    <a href="/sessions"   class="nav-item" data-nav="/sessions">Sessions</a>
    <a href="/detection"  class="nav-item" data-nav="/detection">Détection</a>
    <a href="/settings"   class="nav-item" data-nav="/settings">Réglages</a>
  </nav>
</header>

<main>
  <h1 class="page-title">Enregistrements</h1>
  <p class="page-sub">Fichiers générés (rétention 24 h / 48 h)</p>

  <div class="studio-tabs" role="tablist" style="margin-bottom:1.25rem">
    <button class="studio-tab active" data-mode="all">Tous</button>
    <button class="studio-tab" data-mode="tts">TTS</button>
    <button class="studio-tab" data-mode="stt">STT</button>
    <button class="studio-tab" data-mode="live">Live</button>
  </div>

  <div id="recStats" style="font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--text3);margin-bottom:1rem"></div>

  <!-- Barre d'actions de sélection (apparaît dès qu'au moins 1 case cochée) -->
  <div id="recBulkBar" style="display:none;align-items:center;gap:0.75rem;padding:0.55rem 0.85rem;background:var(--surface3);border:1px solid var(--border);border-radius:8px;margin-bottom:1rem;font-size:0.82rem">
    <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);margin:0">
      <input type="checkbox" id="recSelectAll" style="margin:0">
      <span id="recSelectedCount">0 sélectionné(s)</span>
    </label>
    <button class="btn btn-secondary" id="recBulkDelete" style="margin-left:auto;background:var(--danger);color:white;font-size:0.78rem;padding:0.4rem 0.85rem">🗑 Supprimer la sélection</button>
  </div>

  <div class="voice-list" id="recList"></div>
</main>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/header.js"></script>
<script src="/js/recordings.js"></script>
</body>
</html>
