<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceBridge — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-page" id="loginPage">
    <div class="theme-toggle-fixed">
      <button class="theme-toggle" data-theme-toggle title="Changer de thème">🌙</button>
    </div>
    <div class="login-box">
      <div class="login-logo">
        <div class="login-logo-icon">🎤</div>
        <div class="login-title">VoiceBridge</div>
        <div class="login-sub">Accès sécurisé</div>
      </div>
      <div class="field">
        <label for="pwInput">Mot de passe</label>
        <input type="password" id="pwInput" placeholder="••••••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="loginBtn"
              style="width:100%;justify-content:center;margin-top:0.5rem">
        Accéder →
      </button>
      <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
