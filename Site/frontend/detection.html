<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceBridge — Détection</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/voices.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body>

<header>
  <div class="header-top">
    <a href="/" class="logo"><span class="logo-icon">🎤</span><span>VoiceBridge</span></a>
    <div class="header-actions">
      <button class="status-badge" id="statusBadge"><span class="status-dot"></span><span class="status-label">…</span></button>
      <button class="theme-toggle" data-theme-toggle>🌙</button>
      <button class="btn-header" id="logoutBtn">Déconnexion</button>
    </div>
  </div>
  <nav class="app-nav">
    <a href="/studio"     class="nav-item" data-nav="/studio">Studio</a>
    <a href="/voices"     class="nav-item" data-nav="/voices">Mes voix</a>
    <a href="/recordings" class="nav-item" data-nav="/recordings">Enregistrements</a>
    <a href="/detection"  class="nav-item" data-nav="/detection">Détection</a>
    <a href="/settings"   class="nav-item" data-nav="/settings">Réglages</a>
  </nav>
</header>

<main>
  <h1 class="page-title">Détection</h1>
  <p class="page-sub">Vérifier si un audio est généré par IA — Watermark Perth + Deepfake-audio-detection-V2</p>

  <!-- Step 1 : Type d'analyse -->
  <section class="step done" data-step="1">
    <div class="step-header">
      <div class="step-number">1</div>
      <div class="step-title">Type d'analyse</div>
    </div>

    <div class="radio-group" data-name="mode" style="flex-direction:column;align-items:stretch">
      <button class="radio-option" data-value="watermark" style="justify-content:flex-start;padding:0.6rem 0.85rem">
        <div style="text-align:left">
          <div style="font-weight:600">Vérifier un audio VoiceBridge</div>
          <div style="font-size:0.7rem;color:var(--text3)">Détecte le watermark Perth · Instantané</div>
        </div>
      </button>
      <button class="radio-option" data-value="spectral" style="justify-content:flex-start;padding:0.6rem 0.85rem">
        <div style="text-align:left">
          <div style="font-weight:600">Analyser un audio inconnu</div>
          <div style="font-size:0.7rem;color:var(--text3)">Analyse spectrale Deepfake-audio-detection-V2 · 2 à 5 s</div>
        </div>
      </button>
      <button class="radio-option selected" data-value="both" style="justify-content:flex-start;padding:0.6rem 0.85rem">
        <div style="text-align:left">
          <div style="font-weight:600">Les deux</div>
          <div style="font-size:0.7rem;color:var(--text3)">Watermark + analyse spectrale · Recommandé</div>
        </div>
      </button>
    </div>
  </section>

  <!-- Step 2 : Fichier audio -->
  <section class="step" data-step="2">
    <div class="step-header">
      <div class="step-number">2</div>
      <div class="step-title">Fichier audio</div>
    </div>

    <div class="drop-zone" id="dropZone">
      <div style="font-size:2rem;margin-bottom:0.5rem">📁</div>
      <div style="font-size:0.85rem;color:var(--text2)">Glissez-déposez ici ou cliquez pour sélectionner</div>
      <div class="hint" style="margin-top:0.4rem">WAV, MP3, M4A, OGG · max 50 Mo</div>
      <input type="file" id="fileInput" accept="audio/*" style="display:none">
      <div id="uploadName" style="display:none;margin-top:0.75rem;font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--accent2)"></div>
    </div>

    <button class="btn btn-primary" id="btnAnalyze" style="margin-top:1rem">🔍 Analyser</button>
  </section>

  <!-- Step 3 : Résultat -->
  <section class="step locked" data-step="3">
    <div class="step-header">
      <div class="step-number">3</div>
      <div class="step-title">Résultat</div>
    </div>

    <div class="card" id="resultCard"></div>
    <button class="btn btn-secondary" id="btnCopyReport">📋 Copier le rapport</button>
  </section>
</main>

<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/header.js"></script>
<script src="/js/detection.js"></script>
</body>
</html>
